# Delphi full stack for an 8 GB VPS. Inference runs on Ollama Cloud, so no
# model weights or GPU live here — these four small services fit comfortably.
#
#   doppler setup --project delphi --config dock
#   doppler run --project delphi --config dock -- docker compose --env-file /dev/null up -d --build
#
# Passing --env-file /dev/null keeps Compose from silently reading a local .env;
# Doppler-injected shell variables remain available for interpolation.
#
# Services:
#   caddy         — TLS edge, serves the built UI, proxies the API (injects auth)
#   delphi        — FastAPI gateway; enqueues persist jobs, streams from Ollama Cloud
#   delphi-worker — drains the queue: entity extraction, vault writes, logs, metrics
#   redis         — durable arq job queue between gateway and worker

x-delphi-doppler-env: &delphi-doppler-env
  # Runtime config is injected from Doppler. Keep fixed compose-topology wiring
  # (Redis URL, container paths, internal ports) in each service below.
  DELPHI_BEARER_TOKEN: ${DELPHI_BEARER_TOKEN:?set DELPHI_BEARER_TOKEN in Doppler config delphi/dock}
  DELPHI_DOMAIN: ${DELPHI_DOMAIN:-:80}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  TIMEZONE: ${TIMEZONE:-America/Chicago}
  DELPHI_MODEL_CHAT: ${DELPHI_MODEL_CHAT:-gpt-oss:120b-cloud}
  DELPHI_MODEL_CODE: ${DELPHI_MODEL_CODE:-qwen3-coder:480b-cloud}
  DELPHI_MODEL_REASON: ${DELPHI_MODEL_REASON:-deepseek-v3.1:671b-cloud}
  DELPHI_MODEL_MULTILINGUAL: ${DELPHI_MODEL_MULTILINGUAL:-gpt-oss:120b-cloud}
  DELPHI_MODEL_DEEP_CODE: ${DELPHI_MODEL_DEEP_CODE:-qwen3-coder:480b-cloud}
  DELPHI_MODEL_DEEP_REASON: ${DELPHI_MODEL_DEEP_REASON:-deepseek-v3.1:671b-cloud}
  DELPHI_MODEL_VAULT_QUERY: ${DELPHI_MODEL_VAULT_QUERY:-gpt-oss:120b-cloud}
  DELPHI_MODEL_GRE_QUIZ: ${DELPHI_MODEL_GRE_QUIZ:-gpt-oss:120b-cloud}
  DELPHI_MODEL_GRE_PRACTICE_TEST: ${DELPHI_MODEL_GRE_PRACTICE_TEST:-gpt-oss:120b-cloud}
  DELPHI_MODEL_GRE_PRACTICE_SECONDARY: ${DELPHI_MODEL_GRE_PRACTICE_SECONDARY:-deepseek-v3.1:671b-cloud}
  DELPHI_MODEL_CLASSIFIER: ${DELPHI_MODEL_CLASSIFIER:-gpt-oss:20b-cloud}
  CLASSIFY_ENABLED: ${CLASSIFY_ENABLED:-true}
  MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
  ENTITY_CREATE_THRESHOLD: ${ENTITY_CREATE_THRESHOLD:-2}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Light persistence so a restart doesn't drop queued persist jobs.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  delphi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      # Linux equivalent of Docker Desktop's host.docker.internal. Used when
      # Delphi talks to a host-side llama-server instead of Ollama Cloud.
      - "host.docker.internal:host-gateway"
    environment:
      <<: *delphi-doppler-env
      # Wiring that's fixed by the compose topology (overrides .env.docker).
      WORKER_ENABLED: "true"
      REDIS_URL: "redis://redis:6379"
      DELPHI_PORT: "8080"
      OBSIDIAN_VAULT_PATH: "/vault"
      LOG_DIR: "/var/log/delphi"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      # /vault is a host-path bind mount so Syncthing (running on the host)
      # can keep it in lockstep with the Mac vault — a named Docker volume
      # is opaque to Syncthing. Container runs as uid 1000 (delphi), so the
      # host dir must be chowned to 1000:1000 before the stack starts.
      - ${VAULT_HOST_PATH:-/root/Vault}:/vault
      - logs:/var/log/delphi
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  delphi-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *delphi-doppler-env
      WORKER_ENABLED: "true"
      REDIS_URL: "redis://redis:6379"
      OBSIDIAN_VAULT_PATH: "/vault"
      LOG_DIR: "/var/log/delphi"
      WORKER_METRICS_PORT: "9100"
      # The worker never calls Ollama; skip the boot probe it doesn't need.
      BOOT_PROBE_ENABLED: "false"
    command: ["arq", "worker.main.WorkerSettings"]
    volumes:
      # /vault is a host-path bind mount so Syncthing (running on the host)
      # can keep it in lockstep with the Mac vault — a named Docker volume
      # is opaque to Syncthing. Container runs as uid 1000 (delphi), so the
      # host dir must be chowned to 1000:1000 before the stack starts.
      - ${VAULT_HOST_PATH:-/root/Vault}:/vault
      - logs:/var/log/delphi
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    environment:
      <<: *delphi-doppler-env
    ports:
      # Loopback-only by default — the stack is reached over Tailscale, never
      # the public internet. Caddy injects the bearer token, so "who can reach
      # Caddy" IS the auth boundary; keeping it private keeps that boundary
      # meaningful. On the VPS, front it with Tailscale's own HTTPS:
      #   sudo tailscale serve --bg --https=443 http://127.0.0.1:80
      #   → open https://<machine>.<your-tailnet>.ts.net/
      # For a PUBLIC domain instead: change to "80:80" + "443:443" (binds
      # 0.0.0.0) and set DELPHI_DOMAIN to your hostname — Caddy auto-issues a
      # Let's Encrypt cert. Only do that if you accept public reachability.
      - "127.0.0.1:80:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      delphi:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  redis-data:
  logs:
  caddy-data:
  caddy-config:
  # ``vault`` used to be a named volume here. It is now a host bind mount
  # (see the ``delphi`` and ``delphi-worker`` ``volumes`` sections) so that
  # Syncthing on the host can mirror the directory with the Mac vault. The
  # old ``delphi_vault`` named volume can be deleted once the host path is
  # populated:
  #     docker volume rm delphi_vault
